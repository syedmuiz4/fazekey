name: fazekey
description: FaceKey smart campus access control with offline face recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  cloud_firestore: ^5.6.0
  csv: ^6.0.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  fl_chart: ^0.69.2
  flutter_local_notifications: ^17.2.4
  google_fonts: ^6.2.1
  google_mlkit_face_detection: ^0.13.1
  image: ^4.5.2
  image_picker: ^1.1.2
  intl: ^0.20.1
  lottie: ^3.1.3
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  share_plus: ^13.1.0
  shimmer: ^3.0.0
  sqflite: ^2.4.1
  tflite_flutter: ^0.11.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/lottie/
    - assets/images/
