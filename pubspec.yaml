name: fazekey
description: FaceKey smart campus access control with offline face recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  cloud_firestore: ^5.6.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  google_ml_kit: ^0.19.0
  image: ^4.5.2
  intl: ^0.20.1
  lottie: ^3.1.3
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  shimmer: ^3.0.0
  sqflite: ^2.4.1
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/lottie/
    - assets/images/
